name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint job: checks code quality and formatting
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/alberto-finazzi95/ai-decisional-tree-container:latest
      options: --user root
    env:
      PYTHONPATH: ${{ github.workspace }}/ai-decisional-tree

    steps:
      # Download the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v5

      # Run Ruff to check for linting issues in the Python code
      - name: Ruff lint
        run: ruff check . --statistics --output-format=full

      # Run Black in check mode to verify code formatting without modifying files
      - name: Black check
        run: black --check .

  # Test job: runs the unit test suite and produces a coverage report
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alberto-finazzi95/ai-decisional-tree-container:latest
      options: --user root
    needs: [lint]
    env:
      PYTHONPATH: ${{ github.workspace }}/ai-decisional-tree

    steps:
      # Download the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v5

      # Run the project test suite and generate coverage output
      - name: Run tests with coverage
        run: |
          coverage run --source=ai-decisional-tree ai-decisional-tree/tests/run_tests.py
          coverage xml -o coverage.xml

      # Upload the generated coverage report as a workflow artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  # SonarQube job: analyzes the code quality and test coverage after lint and tests pass
  sonar:
    name: SonarQube analysis
    needs: [lint, tests]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alberto-finazzi95/ai-decisional-tree-container:latest
      options: --user root
    steps:
      # Download the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # Download the generated coverage artifact from the previous job
      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: .

      # This step should build, test and generate coverage reports
      # - name: Build and test
      #   run: <build + test + generate coverage reports>
      - name: Cache SonarQube packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=alberto-finazzi
            -Dsonar.projectKey=alberto-finazzi95_AI-Decisional-Tree
            -Dsonar.sources=ai-decisional-tree/src
            -Dsonar.tests=ai-decisional-tree/tests
            -Dsonar.python.version=3.14
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions='**/__pycache__/**,**/.venv/**,**/file/**,**/file_copy/**'
            -Dsonar.coverage.exclusions='**/tests/**'

      # Add a concise scan summary with a link to the full SonarCloud dashboard
      - name: Add SonarCloud summary
        env:
          SONAR_PROJECT_KEY: alberto-finazzi95_AI-Decisional-Tree
        run: python .github/scripts/sonar_summary.py

      # Inform the user when SonarQube is not configured in repository secrets
      - name: SonarQube not configured
        run: |
          echo "SonarQube is disabled because SONAR_TOKEN is not configured."
          echo "Add a valid SONAR_TOKEN to GitHub Secrets and make sure its SonarCloud account has access to the configured project and organization."

  # Build the Doxygen site and publish it to GitHub Pages after checks pass
  docs:
    name: Generate and publish documentation
    needs: [lint, tests]
    # Reuse the standalone workflow and provide the project's container image
    uses: ./.github/workflows/docs.yml
    with:
      container_image: ghcr.io/alberto-finazzi95/ai-decisional-tree-container:latest
    # Grant the reusable workflow access required to publish the Pages site
    permissions:
      contents: read
      pages: write
      id-token: write

  # Review pull requests with PR-Agent without exposing the Gemini key to forks
  pr-agent:
    name: AI pull request review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_AGENT_ENABLED: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      # Run an automatic review when a same-repository pull request is opened or updated
      - name: Review pull request with PR-Agent
        if: env.PR_AGENT_ENABLED == 'true'
        uses: docker://pragent/pr-agent:0.50.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: gemini/gemini-3.8-flash
          config.fallback_models: '[]'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

      # Explain why the review did not run until the Gemini API key is configured
      - name: Report missing Gemini API key
        if: env.PR_AGENT_ENABLED != 'true'
        run: echo "::notice::PR-Agent skipped. Add GEMINI_API_KEY to repository Actions secrets to enable AI reviews."
